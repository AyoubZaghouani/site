<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NOOH Admin — نوح | لوحة الإدارة</title>
<meta name="description" content="NOOH Boutique Admin — inventory management. إدارة مخزون بوتيك نوح." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="nouh.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="styles.css" />
<style>
/* ══ Admin layout overrides — reuses the storefront design tokens from styles.css ══ */

/* Login screen */
.admin-login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(1100px 600px at 50% -10%, var(--color-primary-container), transparent 60%), var(--color-surface); }
.admin-login-card { width: 100%; max-width: 460px; background: var(--color-surface-bright); border: 1px solid var(--hairline); border-radius: var(--radius-xl); padding: 40px 36px; box-shadow: 0 24px 60px rgba(25, 21, 18, 0.14); }
.admin-login-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; }
.admin-login-logo img { height: 64px; width: auto; mix-blend-mode: multiply; }
.admin-login-title { font-family: var(--font-display); font-size: 1.6rem; text-align: center; }
.admin-login-sub { text-align: center; margin-top: 6px; }

/* Form fields */
.admin-field { margin-bottom: 18px; }
.admin-field > .admin-label, .admin-field > label { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; color: var(--color-on-surface-variant); margin-bottom: 8px; }
.admin-field > .admin-label i, .admin-field > label i { color: var(--color-rose-deep); }
.admin-input, .admin-textarea { width: 100%; padding: 12px 14px; background: var(--color-surface-container-low); border: 1px solid var(--hairline); border-radius: var(--radius-default); font-size: 0.95rem; transition: var(--transition-smooth); }
.admin-input:focus, .admin-textarea:focus { border-color: var(--color-rose-deep); box-shadow: 0 0 12px rgba(194, 156, 150, 0.28); }
.admin-password-wrap { position: relative; }
.admin-password-input { padding-left: 46px; }
.admin-password-toggle { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: var(--color-on-surface-variant); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: var(--transition-smooth); }
.admin-password-toggle:hover { background: var(--color-surface-container-high); color: var(--color-rose-deep); }
.admin-textarea { min-height: 96px; resize: vertical; }
.admin-file-label { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 22px 16px; border: 1.5px dashed rgba(33, 29, 27, 0.25); border-radius: var(--radius-default); background: var(--color-surface-container-lowest); cursor: pointer; color: var(--color-on-surface-variant); font-size: 0.85rem; text-align: center; transition: var(--transition-smooth); }
.admin-file-label:hover { border-color: var(--color-primary); color: var(--color-rose-ink); background: var(--color-primary-container); }
.admin-file-label i { font-size: 1.4rem; color: var(--color-rose-deep); }
.admin-file-hint { font-size: 0.75rem; color: var(--color-on-surface-variant); margin-top: 6px; word-break: break-all; }
.admin-image-preview { margin-top: 12px; width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--radius-default); border: 1px solid var(--hairline); }
.admin-error { color: var(--color-sale-red); font-size: 0.85rem; margin-top: 10px; text-align: center; min-height: 18px; }

/* Dashboard shell */
.admin-main { max-width: var(--container-max); margin: 0 auto; padding: 40px var(--spacing-gutter) 80px; width: 100%; }
.admin-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
.admin-hero-meta { text-align: left; }
.admin-layout { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: start; }
@media (min-width: 1024px) { .admin-layout { grid-template-columns: 400px 1fr; } }
.admin-panel { background: var(--color-surface-bright); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: 28px; }
.admin-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--hairline); }
.admin-panel-head h2 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 400; }

/* Inventory cards */
.inventory-list { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 768px) { .inventory-list { grid-template-columns: repeat(2, 1fr); } }
.inventory-card { display: flex; flex-direction: column; gap: 14px; background: var(--color-surface-container-lowest); border: 1px solid var(--hairline); border-radius: var(--radius-default); padding: 16px; transition: var(--transition-smooth); }
.inventory-card-top { display: flex; gap: 14px; }
.inventory-thumb { width: 72px; height: 88px; border-radius: var(--radius-sm); object-fit: cover; background: var(--color-surface-container-high); flex-shrink: 0; }
.inventory-info { flex: 1; min-width: 0; }
.inventory-title { font-weight: 600; font-size: 0.95rem; line-height: 1.4; margin-bottom: 4px; }
.inventory-desc { font-size: 0.8rem; color: var(--color-on-surface-variant); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.inventory-date { font-size: 0.7rem; color: var(--color-outline); margin-top: 6px; }
.inventory-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.inventory-field { display: flex; flex-direction: column; gap: 6px; }
.inventory-field > span { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; color: var(--color-on-surface-variant); text-transform: uppercase; }
.inventory-actions { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.inventory-save { width: 38px; height: 38px; border-radius: var(--radius-full); background: var(--color-primary-container); color: var(--color-on-primary-container); display: inline-flex; align-items: center; justify-content: center; transition: var(--transition-smooth); }
.inventory-save:hover { background: var(--color-primary); color: #fff; }
.inventory-save.loading { pointer-events: none; opacity: 0.6; }
.btn-danger { background: var(--color-sale-red); color: #fff; }
.btn-danger:hover { background: var(--color-rose-deep); }
.admin-loading { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px 20px; color: var(--color-on-surface-variant); }

/* ══ Responsive ══ */
@media (max-width: 1023px) {
  .admin-main { padding: 32px 20px 72px; }
  .admin-layout { grid-template-columns: 1fr; }
  .admin-panel { padding: 24px; }
}
@media (max-width: 767px) {
  .admin-login-card { padding: 28px 20px; }
  .admin-login-title { font-size: 1.4rem; }
  .admin-main { padding: 24px 16px 60px; }
  .admin-panel { padding: 20px 16px; }
  .admin-hero { flex-direction: column; align-items: flex-start; gap: 12px; }
  .admin-hero-meta { text-align: start; }
  .admin-navbar .brand-sub { display: none; }
  .admin-navbar .nav-container { gap: 8px; padding: 10px 16px; flex-wrap: wrap; }
  .admin-navbar .nav-actions { width: 100%; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
  .admin-navbar .btn { padding: 9px 14px; font-size: 0.75rem; }
  .inventory-card-top { flex-direction: column; }
  .inventory-thumb { width: 100%; height: 140px; }
  .inventory-actions { flex-direction: column; align-items: stretch; }
  .inventory-actions .btn { width: 100%; justify-content: center; }
  .inventory-fields { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .admin-login-card { padding: 24px 16px; }
  .admin-login-title { font-size: 1.3rem; }
  .admin-navbar .nav-actions { justify-content: stretch; }
  .admin-navbar .btn { width: 100%; justify-content: center; }
  .inventory-thumb { height: 120px; }
}
</style>
</head>
<body>

<!-- ══ Admin Login ══ -->
<section id="admin-login-view" class="admin-login-view">
  <div class="admin-login-card">
    <div class="admin-login-logo">
      <img src="assets/logo-nooh.png" alt="NOOH — نوح" />
      <span class="brand-sub">لوحة الإدارة</span>
    </div>
    <h1 class="admin-login-title">تسجيل الدخول</h1>
    <p class="label-sm text-muted admin-login-sub">الوصول مخصّص لإدارة المتجر فقط.</p>
    <form id="admin-login-form" class="mt-12">
      <div class="admin-field">
        <label for="login-email"><i class="fa-regular fa-envelope"></i> البريد الإلكتروني</label>
        <input class="admin-input" type="email" id="login-email" autocomplete="email" required placeholder="admin@nooh.com" />
      </div>
      <div class="admin-field">
        <label for="login-password"><i class="fa-solid fa-lock"></i> كلمة المرور</label>
        <div class="admin-password-wrap">
          <input class="admin-input admin-password-input" type="password" id="login-password" autocomplete="current-password" required placeholder="••••••••" />
          <button type="button" class="admin-password-toggle" aria-label="عرض كلمة المرور" data-toggle-for="login-password">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-lock"></i> <span>تسجيل الدخول</span></button>
      <p id="login-error" class="admin-error"></p>
    </form>
  </div>
</section>

<!-- ══ Admin Dashboard ══ -->
<div id="admin-dashboard" class="hidden">
  <header class="navbar-glass admin-navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/logo-nooh.png" alt="NOOH — نوح" class="brand-logo-img" />
        <span class="brand-sub">لوحة الإدارة</span>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-right"></i> العودة إلى المتجر</a>
        <button id="logout-btn" class="btn btn-rose btn-sm"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-hero">
      <div>
        <span class="tag-pill"><span class="dot"></span> إدارة المخزون</span>
        <h1 class="headline-lg">لوحة تحكم نوح</h1>
        <p class="body-lg text-muted">أضف القطع، وحدّث الأسعار والكميات المتوفرة مباشرة.</p>
      </div>
      <div class="admin-hero-meta">
        <span class="label-sm text-muted">مسجّل الدخول</span>
        <div id="admin-user-email" class="body-md text-rose"></div>
      </div>
    </section>

    <div class="admin-layout">
      <!-- Add Article -->
      <section class="admin-panel">
        <div class="admin-panel-head">
          <h2>إضافة قطعة جديدة</h2>
          <i class="fa-solid fa-plus text-rose"></i>
        </div>
        <form id="add-article-form">
          <div class="admin-field">
            <span class="admin-label"><i class="fa-regular fa-pen-to-square"></i> العنوان</span>
            <input class="admin-input" type="text" id="article-title" required placeholder="مثال: عقد لؤلؤ باروك" />
          </div>
          <div class="admin-field">
            <span class="admin-label"><i class="fa-regular fa-file-lines"></i> الوصف</span>
            <textarea class="admin-textarea" id="article-description" placeholder="وصف مختصر للقطعة…"></textarea>
          </div>
          <div class="inventory-fields">
            <div class="admin-field" style="margin-bottom: 0;">
              <span class="admin-label"><i class="fa-solid fa-dollar-sign"></i> السعر ($)</span>
              <input class="admin-input" type="number" id="article-price" step="0.01" min="0" required placeholder="0.00" />
            </div>
            <div class="admin-field" style="margin-bottom: 0;">
              <span class="admin-label"><i class="fa-solid fa-boxes-stacked"></i> الكمية المتوفرة</span>
              <input class="admin-input" type="number" id="article-stock" step="1" min="0" required placeholder="0" />
            </div>
          </div>
          <div class="admin-field" style="margin-top: 18px;">
            <span class="admin-label"><i class="fa-regular fa-image"></i> صورة القطعة</span>
            <label class="admin-file-label">
              <i class="fa-regular fa-image"></i>
              <span>اضغط لاختيار صورة</span>
              <input type="file" id="article-image" accept="image/*" hidden />
            </label>
            <p id="image-filename" class="admin-file-hint"></p>
            <img id="image-preview" class="admin-image-preview hidden" alt="معاينة الصورة" />
          </div>
          <button type="submit" class="btn btn-primary btn-block mt-12"><i class="fa-solid fa-plus"></i> <span>إضافة القطعة</span></button>
        </form>
      </section>

      <!-- Inventory -->
      <section class="admin-panel">
        <div class="admin-panel-head">
          <h2>المخزون الحالي</h2>
          <span id="inventory-count" class="label-lg text-rose"></span>
        </div>
        <div id="inventory-list"></div>
      </section>
    </div>
  </main>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
